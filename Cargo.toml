[package]
name = "tabularis-duckdb-plugin"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rusty-sheet community extensions require DuckDB >= 1.4.2
duckdb = { version = "1.4.2", features = ["bundled"] }
log = "0.4"
base64 = "0.22"
